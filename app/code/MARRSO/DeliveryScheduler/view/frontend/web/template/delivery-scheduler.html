<div class="marrso-delivery-scheduler" data-bind="visible: isVisible">
    <div class="marrso-delivery-scheduler__header">
        <h3 class="marrso-delivery-scheduler__title" data-bind="i18n: 'How do you want to receive your order?'"></h3>
    </div>

    <div class="marrso-delivery-scheduler__loader" data-bind="visible: isLoading">
        <span class="marrso-delivery-scheduler__loader-dot"></span>
        <span data-bind="i18n: 'Loading delivery options...'"></span>
    </div>

    <div class="message message-error error" data-bind="visible: errorMessage, text: errorMessage"></div>

    <!-- Method cards -->
    <div class="marrso-method-cards">
        <!-- ko if: moduleConfig.enablePickup !== false -->
        <button type="button"
                class="marrso-method-card"
                data-bind="css: { 'is-selected': activeMethod() === 'pickup' }, click: function() { switchMethod('pickup'); }">
            <span class="marrso-method-card__icon" aria-hidden="true">📍</span>
            <span class="marrso-method-card__body">
                <span class="marrso-method-card__label" data-bind="i18n: 'Pickup point'"></span>
                <span class="marrso-method-card__hint" data-bind="i18n: 'Click & Collect'"></span>
                <span class="marrso-method-card__badge marrso-method-card__badge--free" data-bind="i18n: 'FREE'"></span>
            </span>
        </button>
        <!-- /ko -->

        <!-- ko if: isMethodEnabled('express_180') -->
        <button type="button"
                class="marrso-method-card"
                data-bind="css: { 'is-selected': activeMethod() === 'express_180', 'is-disabled': !isMethodAvailable('express_180') }, click: function() { switchMethod('express_180'); }">
            <span class="marrso-method-card__icon" aria-hidden="true">⚡</span>
            <span class="marrso-method-card__body">
                <span class="marrso-method-card__label" data-bind="i18n: '180 min delivery'"></span>
                <span class="marrso-method-card__hint" data-bind="i18n: 'Receive in up to 3 hours'"></span>
                <span class="marrso-method-card__badge" data-bind="text: getMethodPriceLabel('express_180')"></span>
            </span>
        </button>
        <!-- /ko -->

        <!-- ko if: isMethodEnabled('express_24') -->
        <button type="button"
                class="marrso-method-card"
                data-bind="css: { 'is-selected': activeMethod() === 'express_24', 'is-disabled': !isMethodAvailable('express_24') }, click: function() { switchMethod('express_24'); }">
            <span class="marrso-method-card__icon" aria-hidden="true">🚚</span>
            <span class="marrso-method-card__body">
                <span class="marrso-method-card__label" data-bind="i18n: '24 hour delivery'"></span>
                <span class="marrso-method-card__hint" data-bind="i18n: 'Tomorrow or today'"></span>
                <span class="marrso-method-card__badge" data-bind="text: getMethodPriceLabel('express_24')"></span>
            </span>
        </button>
        <!-- /ko -->

        <!-- ko if: moduleConfig.enableDelivery !== false -->
        <button type="button"
                class="marrso-method-card"
                data-bind="css: { 'is-selected': activeMethod() === 'scheduled', 'is-disabled': !isMethodAvailable('scheduled') }, click: function() { switchMethod('scheduled'); }">
            <span class="marrso-method-card__icon" aria-hidden="true">📅</span>
            <span class="marrso-method-card__body">
                <span class="marrso-method-card__label" data-bind="i18n: 'Scheduled delivery'"></span>
                <span class="marrso-method-card__hint" data-bind="i18n: 'Choose date and time'"></span>
                <span class="marrso-method-card__badge" data-bind="text: getMethodPriceLabel('scheduled')"></span>
            </span>
        </button>
        <!-- /ko -->
    </div>

    <!-- Pickup panel -->
    <div class="marrso-panel" data-bind="visible: activeMethod() === 'pickup' && moduleConfig.enablePickup !== false">
        <div class="marrso-panel__toolbar marrso-panel__toolbar--actions">
            <input type="search"
                   class="marrso-search"
                   data-bind="value: pickupSearchQuery, attr: {placeholder: $t('Search by district, mall or address...')}"
                   autocomplete="off"/>
            <div class="marrso-panel__buttons">
                <!-- ko if: moduleConfig.enablePickupMap !== false -->
                <button type="button"
                        class="marrso-btn marrso-btn--secondary"
                        data-bind="click: requestGeolocation.bind($data, true), attr: {title: $t('Use my location')}">
                    <span data-bind="i18n: 'Near me'"></span>
                </button>
                <button type="button"
                        class="marrso-btn marrso-btn--secondary"
                        data-bind="click: togglePickupMapView, css: {'is-active': showPickupMap()}, visible: hasMappableLocations() && !showPickupMap()">
                    <span data-bind="i18n: 'View map'"></span>
                </button>
                <button type="button"
                        class="marrso-btn marrso-btn--secondary"
                        data-bind="click: togglePickupMapView, visible: hasMappableLocations() && showPickupMap()">
                    <span data-bind="i18n: 'Hide map'"></span>
                </button>
                <!-- /ko -->
                <button type="button"
                        class="marrso-btn marrso-btn--secondary"
                        data-bind="click: toggleSortByNearest, css: {'is-active': sortByNearest()}">
                    <span data-bind="i18n: 'Nearest first'"></span>
                </button>
            </div>
        </div>

        <p class="marrso-panel__hint" data-bind="visible: geolocationMessage, text: geolocationMessage"></p>

        <!-- ko if: moduleConfig.enablePickupMap !== false && showPickupMap() && hasMappableLocations() -->
        <div class="marrso-pickup-map" data-bind="afterRender: onMapContainerRendered"></div>
        <!-- /ko -->

        <div class="marrso-location-list" data-bind="visible: !showPickupMap(), foreach: filteredPickupLocations">
            <article class="marrso-location-card"
                     data-bind="css: { 'is-selected': $parent.isPickupLocationSelected($data) }, click: function() { $parent.selectPickupLocation($data); }">
                <div class="marrso-location-card__main">
                    <div class="marrso-location-card__top">
                        <!-- ko if: $data.brand -->
                        <span class="marrso-location-card__brand" data-bind="text: $data.brand"></span>
                        <!-- /ko -->
                        <!-- ko if: $data.badge -->
                        <span class="marrso-location-card__badge" data-bind="text: $data.badge"></span>
                        <!-- /ko -->
                    </div>
                    <h4 class="marrso-location-card__name" data-bind="text: name"></h4>
                    <p class="marrso-location-card__address" data-bind="text: address"></p>
                    <!-- ko if: $data.location_references -->
                    <p class="marrso-location-card__references">
                        <span data-bind="i18n: 'Reference:'"></span>
                        <span data-bind="text: $data.location_references"></span>
                    </p>
                    <!-- /ko -->
                    <div class="marrso-location-card__meta">
                        <!-- ko if: $data.distance_km != null && $data.distance_km !== '' -->
                        <span class="marrso-location-card__distance">
                            <span data-bind="text: $parent.formatDistance($data.distance_km)"></span>
                            <span data-bind="i18n: 'km away'"></span>
                        </span>
                        <!-- /ko -->
                        <!-- ko if: $data.opening_hours -->
                        <span class="marrso-location-card__hours" data-bind="text: $data.opening_hours"></span>
                        <!-- /ko -->
                        <!-- ko if: $data.retention_days -->
                        <span class="marrso-location-card__retention">
                            <span data-bind="i18n: 'Hold up to'"></span>
                            <span data-bind="text: $data.retention_days"></span>
                            <span data-bind="i18n: 'days'"></span>
                        </span>
                        <!-- /ko -->
                    </div>
                </div>
                <span class="marrso-location-card__price marrso-location-card__price--free" data-bind="i18n: 'FREE'"></span>
            </article>
        </div>

        <div class="marrso-no-results" data-bind="visible: filteredPickupLocations().length === 0 && !isLoading() && !showPickupMap()">
            <span data-bind="i18n: 'No pickup points available'"></span>
        </div>

        <!-- ko if: selectedPickupLocation() && pickupDateGroups().length -->
        <div class="marrso-slot-picker">
            <p class="marrso-slot-picker__label" data-bind="i18n: 'Select pickup date'"></p>
            <div class="marrso-date-row" data-bind="foreach: pickupDateGroups">
                <button type="button"
                        class="marrso-date-chip"
                        data-bind="css: { 'is-selected': $parent.isPickupDateSelected(date) }, click: function() { $parent.selectPickupDate(date); }">
                    <span data-bind="text: label"></span>
                </button>
            </div>

            <p class="marrso-slot-picker__label" data-bind="i18n: 'Select time slot'"></p>
            <div class="marrso-time-row" data-bind="foreach: pickupSlotsForSelectedDate">
                <button type="button"
                        class="marrso-time-chip"
                        data-bind="css: { 'is-selected': $parent.isPickupSlotSelected($data) }, click: function(data, event) { event.stopPropagation(); $parent.selectPickupSlot($data); }">
                    <span class="marrso-time-chip__time"
                          data-bind="text: $parent.formatTime(start_time) + ' - ' + $parent.formatTime(end_time)"></span>
                    <!-- ko if: available_spots -->
                    <span class="marrso-time-chip__spots">
                        <span data-bind="text: available_spots"></span>
                        <span data-bind="i18n: 'spots'"></span>
                    </span>
                    <!-- /ko -->
                </button>
            </div>
        </div>
        <!-- /ko -->

        <!-- ko if: selectedPickupLocation() && !pickupDateGroups().length -->
        <p class="marrso-no-results" data-bind="i18n: 'No pickup times available for this location yet.'"></p>
        <!-- /ko -->
    </div>

    <!-- Delivery panel -->
    <div class="marrso-panel" data-bind="visible: isDeliveryMethod() && moduleConfig.enableDelivery !== false">
        <!-- ko if: !customerDistrict() -->
        <p class="marrso-panel__hint" data-bind="i18n: 'Enter your city in the shipping address to see delivery slots.'"></p>
        <!-- /ko -->

        <!-- ko if: customerDistrict() && deliveryDateGroups().length -->
        <div class="marrso-slot-picker">
            <p class="marrso-slot-picker__label" data-bind="i18n: 'Select delivery date'"></p>
            <div class="marrso-date-row" data-bind="foreach: deliveryDateGroups">
                <button type="button"
                        class="marrso-date-chip"
                        data-bind="css: { 'is-selected': $parent.isDeliveryDateSelected(date) }, click: function() { $parent.selectDeliveryDate(date); }">
                    <span data-bind="text: label"></span>
                </button>
            </div>

            <p class="marrso-slot-picker__label" data-bind="i18n: 'Select time slot'"></p>
            <div class="marrso-time-row" data-bind="foreach: deliverySlotsForSelectedDate">
                <button type="button"
                        class="marrso-time-chip"
                        data-bind="css: { 'is-selected': $parent.isDeliverySlotSelected($data) }, click: function() { $parent.selectDeliverySlot($data); }">
                    <span class="marrso-time-chip__time"
                          data-bind="text: $parent.formatTime(start_time) + ' - ' + $parent.formatTime(end_time)"></span>
                    <span class="marrso-time-chip__price" data-bind="text: $parent.formatSlotPrice($data)"></span>
                    <!-- ko if: available_spots -->
                    <span class="marrso-time-chip__spots">
                        <span data-bind="text: available_spots"></span>
                        <span data-bind="i18n: 'spots'"></span>
                    </span>
                    <!-- /ko -->
                </button>
            </div>
        </div>
        <!-- /ko -->

        <div class="marrso-no-results" data-bind="visible: customerDistrict() && deliveryDateGroups().length === 0 && !isLoading()">
            <span data-bind="i18n: 'No delivery slots available for your area'"></span>
        </div>
    </div>

    <!-- Instructions -->
    <div class="marrso-instructions" data-bind="visible: isValid()">
        <label for="marrso-delivery-instructions">
            <span data-bind="i18n: 'Delivery instructions (optional)'"></span>
        </label>
        <textarea id="marrso-delivery-instructions"
                  class="input-text marrso-instructions__input"
                  rows="2"
                  data-bind="value: deliveryInstructions, attr: {placeholder: $t('e.g. Leave with reception, call on arrival...')}, event: { change: saveComment, blur: saveComment }"></textarea>
    </div>

    <!-- Sticky summary -->
    <aside class="marrso-summary" data-bind="visible: isValid()">
        <div class="marrso-summary__icon" aria-hidden="true">✓</div>
        <div class="marrso-summary__content">
            <p class="marrso-summary__title" data-bind="i18n: 'Your delivery'"></p>
            <p class="marrso-summary__method" data-bind="text: getActiveMethodLabel()"></p>
            <p class="marrso-summary__text" data-bind="text: summaryText"></p>
            <!-- ko if: selectedPickupLocation() -->
            <p class="marrso-summary__detail" data-bind="text: selectedPickupLocation().location_references"></p>
            <!-- /ko -->
        </div>
    </aside>
</div>
